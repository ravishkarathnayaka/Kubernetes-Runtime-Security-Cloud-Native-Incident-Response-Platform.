name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Controller Unit Tests & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r response_controller/requirements.txt
          pip install pytest pytest-cov

      - name: Run Unit & Rule Syntax Tests
        run: |
          pytest tests/ -v --cov=response_controller --cov-report=term-missing

      - name: Install Kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -sL https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating NetworkPolicies..."
          kubeconform -strict -summary -kubernetes-version 1.30.0 network_policies/*.yaml
          echo "Validating Controller Manifests..."
          if [ -d cluster/manifests ]; then
            kubeconform -strict -summary -kubernetes-version 1.30.0 cluster/manifests/*.yaml
          fi
