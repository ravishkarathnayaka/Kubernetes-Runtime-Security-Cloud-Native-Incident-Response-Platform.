apiVersion: v1
kind: Namespace
metadata:
  name: falco-response
  labels:
    app.kubernetes.io/part-of: incident-response-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-response-controller
  namespace: falco-response
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco-response-controller-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco-response-controller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco-response-controller-role
subjects:
  - kind: ServiceAccount
    name: falco-response-controller
    namespace: falco-response
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-response-controller
  namespace: falco-response
  labels:
    app: falco-response-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falco-response-controller
  template:
    metadata:
      labels:
        app: falco-response-controller
    spec:
      serviceAccountName: falco-response-controller
      containers:
        - name: controller
          image: falco-response-controller:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: EVIDENCE_DIR
              value: "/evidence"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: evidence-storage
              mountPath: /evidence
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: evidence-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: falco-response-controller
  namespace: falco-response
  labels:
    app: falco-response-controller
spec:
  type: ClusterIP
  selector:
    app: falco-response-controller
  ports:
    - port: 8080
      targetPort: 8080
      name: http
      protocol: TCP
