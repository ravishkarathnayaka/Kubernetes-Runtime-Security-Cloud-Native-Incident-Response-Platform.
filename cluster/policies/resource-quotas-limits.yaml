apiVersion: v1
kind: LimitRange
metadata:
  name: security-baseline-limits
  namespace: demo
  labels:
    app.kubernetes.io/part-of: incident-response-platform
    policy.security/standard: baseline
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: security-resource-quota
  namespace: demo
spec:
  hard:
    pods: "50"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
